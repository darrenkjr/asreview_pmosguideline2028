name: Docker staging deployment

on:
  push:
    branches:
      - "dev"
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Test the local build before pushing
      - name: Build the image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: asreview/asreview:test

      - name: Test the built image
        run: |
          docker run asreview/asreview:test -h

      # Docker Metadata Extraction
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/asreview_pmosguideline2028
          tags: |
            type=raw,value=staging

      - name: Login to GitHub registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Final Build and Push
      - name: Build and push staging image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }},ghcr.io/${{ github.repository_owner }}/asreview_pmosguideline2028:staging
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max